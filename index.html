<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅程手帳">
<meta name="mobile-web-app-capable" content="yes">
<title>旅程手帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#F3F5F2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;900&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app — trip header card, scrolling panel, fixed bottom tab bar (boarding-pass motif: ink + stamp red) */
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#1B2A33; --muted:#66757D; --line:#DCE2DE;
  --accent:#1E5A6E; --accent-soft:#E1ECEE; --stamp:#C2412D; --ok:#2F7D4F; --warn:#B7791F;
  --shadow:0 1px 2px rgba(27,42,51,.06),0 6px 20px rgba(27,42,51,.06);
  --f-display:"Noto Serif TC","Songti TC",serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#11181C; --surface:#1A2328; --ink:#E6ECEA; --muted:#93A2A8; --line:#2A363C;
  --accent:#6FB3C6; --accent-soft:#1E3239; --stamp:#E56A55; --ok:#5DBB83; --warn:#E0A84A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11181C; --surface:#1A2328; --ink:#E6ECEA; --muted:#93A2A8; --line:#2A363C;
  --accent:#6FB3C6; --accent-soft:#1E3239; --stamp:#E56A55; --ok:#5DBB83; --warn:#E0A84A;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}

/* trip header as a boarding pass */
.pass{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pass-top{padding:18px 18px 14px;display:flex;gap:12px;align-items:flex-start}
.pass-top .t{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.trip-name{font-family:var(--f-display);font-weight:900;font-size:24px;line-height:1.25;margin:2px 0 0;text-wrap:balance;word-break:break-word}
.dest{color:var(--muted);margin-top:2px}
.stamp{flex:none;border:2px solid var(--stamp);color:var(--stamp);border-radius:10px;padding:4px 10px;font-family:var(--f-mono);font-size:13px;transform:rotate(-4deg);text-align:center;line-height:1.2}
.stamp b{display:block;font-size:20px}
.perf{height:0;border-top:2px dashed var(--line);margin:0 14px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf::before{left:-24px}.perf::after{right:-24px}
.pass-bot{padding:12px 18px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dates{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.link-btn{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:500}
.mode-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

/* panels */
.panel{margin-top:18px}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.panel-head h2{font-family:var(--f-display);font-size:19px;margin:0}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.day small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}

.timeline{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:grid;grid-template-columns:56px 1fr;gap:10px}
.stop .time{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding-top:14px;text-align:right}
.stop .card{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0;border-left:3px solid var(--accent)}
.stop h3{margin:0;font-size:16px;font-weight:700;word-break:break-word}
.stop .place{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.stop .note{font-size:13px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.row-actions{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.chip-link{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;background:none;border:0;padding:0}
.chip-link.muted{color:var(--muted)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

/* budget */
.meter{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.meter .nums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--accent-soft);margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.over i{background:var(--stamp)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cat{background:var(--accent-soft);border-radius:10px;padding:8px 10px;min-width:0}
.cat .n{font-size:12px;color:var(--muted)}
.cat .v{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.list{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.list li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.list .main div{word-break:break-word}
.list .meta{font-size:12px;color:var(--muted)}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

/* packing */
.quick{display:flex;gap:8px;margin-bottom:4px}
.quick input{flex:1;min-width:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.done .main div:first-child{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 6px;line-height:1}

/* controls */
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--ink);color:var(--bg)}
.btn.ghost{background:var(--accent-soft);color:var(--accent)}
.btn.danger{background:none;color:var(--stamp);padding-inline:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs-inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:24px;height:24px}
.tab[aria-selected="true"]{color:var(--accent);font-weight:700}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));max-height:88%;overflow-y:auto;animation:up .2s ease-out}
.sheet h3{font-family:var(--f-display);margin:0 0 14px;font-size:19px}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.sheet .foot .r{display:flex;gap:8px;margin-left:auto}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30}
@media (max-width:380px){.cats{grid-template-columns:repeat(2,1fr)}}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style><style>
/* gate screens (setup / join) */
.gate{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px 18px;margin-top:16px}
.gate h2{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.gate p{color:var(--muted);margin:0 0 14px}
.gate .stack{display:flex;flex-direction:column;gap:10px}
.or{text-align:center;color:var(--muted);font-size:12px;margin:6px 0}
.codebox{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}
.sync.off i{background:var(--warn)}
.pass-bot .acts{display:flex;gap:16px}
/* ticket photos */
.tickets{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.ticket{flex:none;width:64px;height:64px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0;overflow:hidden;position:relative}
.ticket img{width:100%;height:100%;object-fit:cover;display:block}
.ticket span{position:absolute;inset:auto 0 0;background:rgba(27,42,51,.7);color:#fff;font-size:10px;text-align:center;line-height:16px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(27,42,51,.75);color:#fff;font-size:14px;line-height:24px;padding:0}
label.addphoto{display:inline-block;margin:0;color:var(--accent);font-size:15px;cursor:pointer}
.viewer{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;color:#1B2A33}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px}
.viewer .vbar b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vclose{border:0;background:#1B2A33;color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;flex:none}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vnav{display:flex;justify-content:space-between;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));color:#66757D}
.viewer .vnav button{border:1px solid #DCE2DE;background:#fff;border-radius:10px;padding:8px 16px;color:#1B2A33}
.viewer .vnav button:disabled{opacity:.3}
</style>
</head>
<body>
<div class="app">
  <!-- setup needed -->
  <section class="gate" id="g-setup" hidden>
    <div class="eyebrow">尚未完成設定</div>
    <h2>還沒接上 Firebase</h2>
    <p>請把 Firebase 專案的設定貼進 <b>firebase-config.js</b>，重新上傳到 GitHub 後再打開。</p>
  </section>

  <!-- join / create -->
  <section class="gate" id="g-join" hidden>
    <div class="eyebrow">Boarding · 旅程手帳</div>
    <h2>開始一趟旅程</h2>
    <p>建立新的行程，或用旅伴傳給你的邀請連結／邀請碼加入。</p>
    <div class="stack">
      <button class="btn" id="createTrip" type="button">建立新旅程</button>
      <div class="or">或</div>
      <form id="joinForm" class="stack">
        <label for="joinInput" style="margin:0">邀請碼或邀請連結</label>
        <input id="joinInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上旅伴給你的邀請碼">
        <button class="btn ghost" type="submit">加入旅程</button>
      </form>
    </div>
  </section>

  <div id="main" hidden>
  <section class="pass" aria-label="旅程資訊">
    <div class="pass-top">
      <div class="t">
        <div class="eyebrow">Boarding · 旅程</div>
        <h1 class="trip-name" id="tripName">我的旅程</h1>
        <div class="dest" id="tripDest">尚未設定目的地</div>
      </div>
      <div class="stamp" id="stamp" hidden></div>
    </div>
    <div class="perf"></div>
    <div class="pass-bot">
      <span class="dates" id="tripDates">日期未設定</span>
      <span class="acts"><button class="link-btn" id="invite" type="button">邀請旅伴</button><button class="link-btn" id="editTrip" type="button">編輯旅程</button></span>
    </div>
  </section>
  <p class="mode-note"><span class="sync" id="syncNote"><i></i>連線中…</span></p>

  <section class="panel" id="p-plan">
    <div class="panel-head"><h2>每日行程</h2><button class="btn ghost" id="addStop" type="button">＋ 新增</button></div>
    <div class="days" id="days" role="group" aria-label="選擇天數"></div>
    <ol class="timeline" id="stops"></ol>
  </section>

  <section class="panel" id="p-budget" hidden>
    <div class="panel-head"><h2>預算記帳</h2><button class="btn ghost" id="addExp" type="button">＋ 記一筆</button></div>
    <div class="meter" id="meter"></div>
    <ul class="list" id="exps"></ul>
  </section>

  <section class="panel" id="p-pack" hidden>
    <div class="panel-head"><h2>行李清單</h2><span class="sub" id="packCount"></span></div>
    <form class="quick" id="packForm"><input id="packInput" placeholder="新增物品，例如：護照、轉接頭" autocomplete="off" aria-label="新增物品"><button class="btn" type="submit">加入</button></form>
    <ul class="list" id="packs"></ul>
  </section>
  </div>
</div>

<nav class="tabs" role="tablist" id="tabs" hidden><div class="tabs-inner">
  <button class="tab" role="tab" data-tab="plan" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>行程</button>
  <button class="tab" role="tab" data-tab="budget" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/></svg>預算</button>
  <button class="tab" role="tab" data-tab="pack" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="7" width="14" height="13" rx="2.5"/><path d="M9 7V4.5h6V7M9 11v5M15 11v5"/></svg>行李</button>
</div></nav>

<div id="sheetRoot"></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
const V="10.14.1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const CATS=["交通","住宿","餐飲","門票","購物","其他"];
const WD="日一二三四五六";
const KEY="trip-code";
const S={trip:{},stops:{},expenses:{},packing:{},photos:{}};
let fs=null, F=null, tripCode=null, tab="plan", day=1, unsubs=[], online=navigator.onLine;

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function show(view){$("#g-setup").hidden=view!=="setup";$("#g-join").hidden=view!=="join";$("#main").hidden=view!=="main";$("#tabs").hidden=view!=="main"}

/* ---------- invite codes ---------- */
function newCode(){const a="abcdefghjkmnpqrstuvwxyz23456789";const r=crypto.getRandomValues(new Uint8Array(24));return Array.from(r,x=>a[x%a.length]).join("")}
function parseCode(v){v=(v||"").trim();try{const u=new URL(v);v=u.searchParams.get("trip")||v}catch(e){}v=v.replace(/[^a-z0-9]/gi,"").toLowerCase();return v.length>=20&&v.length<=40?v:null}
const inviteLink=()=>location.origin+location.pathname+"?trip="+tripCode;

/* ---------- firestore writes ---------- */
const tripRef=()=>F.doc(fs,"trips",tripCode);
const itemRef=(col,id)=>F.doc(fs,"trips",tripCode,col,id);
function put(col,id,data){
  if(col==="trip"){S.trip={...S.trip,...data}}else{S[col][id]=data}
  render();
  const p=col==="trip"?F.setDoc(tripRef(),data,{merge:true}):F.setDoc(itemRef(col,id),data);
  p.catch(fail);
}
function del(col,id){delete S[col][id];render();F.deleteDoc(itemRef(col,id)).catch(fail)}
function fail(e){console.error(e);toast(e&&e.code==="permission-denied"?"沒有權限，請確認邀請碼是否正確":"儲存失敗："+(e&&e.code||"請稍後再試"))}

/* ---------- open a trip ---------- */
function stopListening(){unsubs.forEach(u=>u());unsubs=[];S.trip={};S.stops={};S.expenses={};S.packing={};S.photos={}}
function openTrip(code){
  stopListening();tripCode=code;lsSet(KEY,code);day=1;history.replaceState(null,"",location.pathname+"?trip="+code);show("main");render();
  let seen=false;
  unsubs.push(F.onSnapshot(tripRef(),{includeMetadataChanges:true},s=>{
    if(!s.exists()){ if(!s.metadata.fromCache){toast("找不到這個旅程，請確認邀請碼");leaveTrip()} return }
    seen=true;S.trip={...s.data()};render();
  },e=>{fail(e)}));
  ["stops","expenses","packing","photos"].forEach(col=>unsubs.push(F.onSnapshot(F.collection(fs,"trips",code,col),q=>{
    const m={};q.forEach(d=>m[d.id]={...d.data()});S[col]=m;render();
  },e=>console.warn(col,e.code))));
}
async function createTrip(){
  const code=newCode();
  try{await Promise.race([F.setDoc(F.doc(fs,"trips",code),{name:"",createdAt:Date.now()}),new Promise(r=>setTimeout(r,4000))]);}catch(e){fail(e);return}
  openTrip(code);setTimeout(editTrip,200);
}
function leaveTrip(){stopListening();tripCode=null;lsSet(KEY,null);history.replaceState(null,"",location.pathname);show("join")}

/* ---------- dates ---------- */
function parseD(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function md(d){return (d.getMonth()+1)+"/"+d.getDate()+" ("+WD[d.getDay()]+")"}
function dayCount(){const a=parseD(S.trip.start),b=parseD(S.trip.end);if(a&&b&&b>=a)return Math.min(30,Math.round((b-a)/864e5)+1);return Math.max(3,...Object.values(S.stops).map(s=>s.day||1))}
const money=n=>{const c=S.trip.currency||"TWD";return c+" "+Math.round(n).toLocaleString("zh-TW")};

/* ---------- render ---------- */
function render(){
  if(!tripCode)return;
  const t=S.trip;
  $("#tripName").textContent=t.name||"我的旅程";
  $("#tripDest").textContent=t.dest||"尚未設定目的地 · 點「編輯旅程」開始";
  const a=parseD(t.start),b=parseD(t.end);
  $("#tripDates").textContent=a&&b?`${a.getFullYear()}/${md(a)} → ${md(b)} · ${dayCount()} 天`:"日期未設定";
  const st=$("#stamp");
  if(a){const today=new Date();today.setHours(0,0,0,0);const diff=Math.round((a-today)/864e5);const n=dayCount();
    st.hidden=false;
    if(diff>0)st.innerHTML=`倒數<b>D-${diff}</b>`;else if(-diff<n)st.innerHTML=`旅途中<b>第${1-diff}天</b>`;else st.innerHTML=`已完成<b>✓</b>`;
  }else st.hidden=true;
  const sn=$("#syncNote");sn.className="sync"+(online?"":" off");sn.lastChild.textContent=online?"已與旅伴同步":"離線中 · 恢復連線後會自動同步";
  renderPlan();renderBudget();renderPack();
}
function renderPlan(){
  const n=dayCount();if(day>n)day=1;const a=parseD(S.trip.start);
  $("#days").innerHTML=Array.from({length:n},(_,i)=>{const d=i+1;const cnt=Object.values(S.stops).filter(s=>(s.day||1)===d).length;
    return `<button class="day" type="button" data-day="${d}" aria-pressed="${d===day}">Day ${d}<small>${a?md(addDays(a,i)):cnt+" 個行程"}</small></button>`}).join("");
  const list=Object.entries(S.stops).filter(([,s])=>(s.day||1)===day).sort((x,y)=>(x[1].time||"99").localeCompare(y[1].time||"99"));
  $("#stops").innerHTML=list.length?list.map(([id,s])=>{
    const q=encodeURIComponent([s.place||s.title,S.trip.dest].filter(Boolean).join(" "));
    return `<li class="stop"><div class="time">${esc(s.time||"—")}</div><div class="card">
      <h3>${esc(s.title)}</h3>${s.place?`<div class="place">📍 ${esc(s.place)}</div>`:""}${s.note?`<div class="note">${esc(s.note)}</div>`:""}
      ${(s.photos||[]).length?`<div class="tickets">${s.photos.map((pid,i)=>`<button class="ticket" type="button" data-view="${id}" data-idx="${i}" aria-label="打開票券 ${i+1}">${S.photos[pid]?`<img src="${S.photos[pid].data}" alt="">`:""}<span>票券 ${i+1}</span></button>`).join("")}</div>`:""}
      <div class="row-actions"><a class="chip-link" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">開啟地圖</a>
      <a class="chip-link" href="https://www.google.com/maps/dir/?api=1&destination=${q}" target="_blank" rel="noopener">導航前往</a>
      <button class="chip-link muted" type="button" data-edit-stop="${id}">編輯</button></div></div></li>`}).join("")
    :`<li class="empty"><strong>Day ${day} 還沒有安排</strong>按右上角「＋ 新增」加入景點、餐廳或交通</li>`;
}
function renderBudget(){
  const ex=Object.entries(S.expenses);const spent=ex.reduce((s,[,e])=>s+(+e.amount||0),0);const budget=+S.trip.budget||0;
  const by={};CATS.forEach(c=>by[c]=0);ex.forEach(([,e])=>by[e.cat||"其他"]=(by[e.cat||"其他"]||0)+(+e.amount||0));
  const pct=budget?Math.min(100,spent/budget*100):0;
  $("#meter").innerHTML=`<div class="nums"><div><div class="sub">已花費</div><div class="big">${money(spent)}</div></div>
    <div style="text-align:right"><div class="sub">${budget?"剩餘":"預算"}</div><div class="big" style="color:${budget&&spent>budget?"var(--stamp)":"inherit"}">${budget?money(budget-spent):"未設定"}</div></div></div>
    ${budget?`<div class="bar ${spent>budget?"over":""}"><i style="width:${pct}%"></i></div><div class="sub">總預算 ${money(budget)} · 已用 ${Math.round(spent/budget*100)}%</div>`:`<div class="sub" style="margin-top:8px">在「編輯旅程」設定總預算，就能看剩多少</div>`}
    <div class="cats">${CATS.map(c=>`<div class="cat"><div class="n">${c}</div><div class="v">${Math.round(by[c]).toLocaleString("zh-TW")}</div></div>`).join("")}</div>`;
  const sorted=ex.sort((x,y)=>(y[1].ts||0)-(x[1].ts||0));
  $("#exps").innerHTML=sorted.length?sorted.map(([id,e])=>`<li><div class="main"><div>${esc(e.title)}</div><div class="meta">${e.day?"Day "+e.day+" · ":""}${e.payer?esc(e.payer)+" 付":""}</div></div><span class="tag">${esc(e.cat||"其他")}</span><span class="amt">${Math.round(+e.amount||0).toLocaleString("zh-TW")}</span><button class="x" type="button" aria-label="編輯" data-edit-exp="${id}">⋯</button></li>`).join("")
    :`<li class="empty" style="border:0"><strong>還沒有記帳</strong>按「＋ 記一筆」記下車票、餐費或住宿</li>`;
}
function renderPack(){
  const it=Object.entries(S.packing).sort((x,y)=>(x[1].done-y[1].done)||((x[1].ts||0)-(y[1].ts||0)));
  const done=it.filter(([,p])=>p.done).length;
  $("#packCount").textContent=it.length?`已打包 ${done} / ${it.length}`:"";
  $("#packs").innerHTML=it.length?it.map(([id,p])=>`<li class="${p.done?"done":""}"><button class="check" type="button" aria-pressed="${!!p.done}" aria-label="已打包" data-toggle="${id}">${p.done?"✓":""}</button><div class="main"><div>${esc(p.text)}</div></div><button class="x" type="button" aria-label="刪除" data-del-pack="${id}">×</button></li>`).join("")
    :`<li class="empty" style="border:0"><strong>清單是空的</strong>在上方輸入要帶的東西，打包好就打勾</li>`;
}

/* ---------- sheets ---------- */
function sheet(title,html,onSave,onDelete,opts={}){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim"><form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${html}
    <div class="foot">${onDelete?`<button class="btn danger" type="button" data-del>${esc(opts.delLabel||"刪除")}</button>`:""}<div class="r"><button class="btn ghost" type="button" data-close>${onSave?"取消":"關閉"}</button>${onSave?`<button class="btn" type="submit">儲存</button>`:""}</div></div></form></div>`;
  const f=root.querySelector("form");const close=()=>root.innerHTML="";
  root.querySelector(".scrim").addEventListener("click",e=>{if(e.target.classList.contains("scrim"))close()});
  f.querySelector("[data-close]").onclick=close;
  let armed=false;const d=f.querySelector("[data-del]");
  if(d)d.onclick=()=>{if(!armed){armed=true;d.textContent="再按一次確認";return}onDelete();close()};
  f.onsubmit=e=>{e.preventDefault();if(!onSave)return;const v=Object.fromEntries(new FormData(f));if(onSave(v)!==false)close()};
  if(opts.onOpen)opts.onOpen(f);
  else{const first=f.querySelector("input,select,textarea");if(first)setTimeout(()=>first.focus(),50)}
}
const dayOptions=sel=>Array.from({length:dayCount()},(_,i)=>`<option value="${i+1}" ${i+1==sel?"selected":""}>Day ${i+1}</option>`).join("");

function editTrip(){
  const t=S.trip;
  sheet("編輯旅程",`
    <div class="field"><label for="f-name">旅程名稱</label><input id="f-name" name="name" value="${esc(t.name)}" placeholder="例如：東京冬季五日遊"></div>
    <div class="field"><label for="f-dest">目的地</label><input id="f-dest" name="dest" value="${esc(t.dest)}" placeholder="例如：日本東京"></div>
    <div class="two field"><div><label for="f-start">出發日</label><input id="f-start" type="date" name="start" value="${esc(t.start)}"></div><div><label for="f-end">回程日</label><input id="f-end" type="date" name="end" value="${esc(t.end)}"></div></div>
    <div class="two field"><div><label for="f-budget">總預算</label><input id="f-budget" type="number" inputmode="decimal" min="0" name="budget" value="${esc(t.budget)}" placeholder="0"></div><div><label for="f-cur">幣別</label><input id="f-cur" name="currency" value="${esc(t.currency||"TWD")}" maxlength="5"></div></div>`,
  v=>{if(v.start&&v.end&&v.end<v.start){toast("回程日不能早於出發日");return false}put("trip",null,{...v,budget:+v.budget||0})});
}
function inviteSheet(){
  const link=inviteLink();
  sheet("邀請旅伴",`
    <p class="sub" style="margin:0 0 10px">把連結傳給旅伴，他打開後就能一起看、一起編輯。拿到連結的人都能修改這份行程，請只傳給同行的人。</p>
    <div class="field"><label>邀請連結</label><div class="codebox" id="inv-link">${esc(link)}</div></div>
    <div class="field"><label>邀請碼</label><div class="codebox">${esc(tripCode)}</div></div>
    <button class="btn" type="button" id="copyLink" style="width:100%">複製邀請連結</button>`,
  null,()=>leaveTrip(),{delLabel:"在這支手機離開旅程",onOpen:f=>{
    f.querySelector("#copyLink").onclick=async()=>{
      try{await navigator.clipboard.writeText(link);toast("已複製邀請連結")}
      catch(e){const r=document.createRange();r.selectNodeContents(f.querySelector("#inv-link"));const s=getSelection();s.removeAllRanges();s.addRange(r);toast("已選取連結，請手動複製")}
    };
  }});
}
async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1600,q=0.88,out="";
    for(let k=0;k<7;k++){
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      out=c.toDataURL("image/jpeg",q);if(out.length<850000)break;max=Math.round(max*0.82);q=Math.max(0.72,q-0.04);
    }
    if(out.length>=950000)throw new Error("too big");
    return out;
  }finally{URL.revokeObjectURL(url)}
}
function editStop(id){
  const s=id?S.stops[id]:{day};
  const keep=[...(s.photos||[])], removed=[], pending=[];
  const drawThumbs=f=>{
    f.querySelector("#s-thumbs").innerHTML=keep.map(pid=>`<div class="thumb">${S.photos[pid]?`<img src="${S.photos[pid].data}" alt="">`:""}<button type="button" data-rm-keep="${pid}" aria-label="移除照片">×</button></div>`).join("")
      +pending.map((p,i)=>`<div class="thumb"><img src="${p}" alt=""><button type="button" data-rm-pend="${i}" aria-label="移除照片">×</button></div>`).join("");
  };
  sheet(id?"編輯行程":"新增行程",`
    <div class="two field"><div><label for="s-day">哪一天</label><select id="s-day" name="day">${dayOptions(s.day||day)}</select></div><div><label for="s-time">時間</label><input id="s-time" type="time" name="time" value="${esc(s.time)}"></div></div>
    <div class="field"><label for="s-title">要做什麼</label><input id="s-title" name="title" required maxlength="100" value="${esc(s.title)}" placeholder="例如：淺草寺參拜"></div>
    <div class="field"><label for="s-place">地點（用來開地圖）</label><input id="s-place" name="place" maxlength="200" value="${esc(s.place)}" placeholder="例如：淺草寺"></div>
    <div class="field"><label for="s-note">備註</label><textarea id="s-note" name="note" maxlength="2000" placeholder="訂位編號、交通方式…">${esc(s.note)}</textarea></div>
    <div class="field"><label>票券／QR Code 照片</label><div class="thumbs" id="s-thumbs"></div>
      <label class="addphoto" for="s-file">＋ 加入照片或截圖</label><input id="s-file" type="file" accept="image/*" multiple hidden>
      <div class="sub" id="s-busy" hidden>照片處理中…</div></div>`,
  v=>{
    if(busy){toast("照片還在處理，請稍等");return false}
    const sid=id||uid();const ids=[...keep];
    pending.forEach(data=>{const pid=uid();ids.push(pid);put("photos",pid,{data,stopId:sid,ts:Date.now()})});
    removed.forEach(pid=>del("photos",pid));
    const {...rest}=v;put("stops",sid,{...rest,day:+v.day,photos:ids});day=+v.day;render();
  },
  id?()=>{(s.photos||[]).forEach(pid=>del("photos",pid));del("stops",id)}:null,
  {onOpen:f=>{
    drawThumbs(f);
    f.querySelector("#s-thumbs").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
      if(b.dataset.rmKeep){const i=keep.indexOf(b.dataset.rmKeep);if(i>=0)removed.push(...keep.splice(i,1))}
      else if(b.dataset.rmPend!=null){pending.splice(+b.dataset.rmPend,1)}
      drawThumbs(f)});
    f.querySelector("#s-file").addEventListener("change",async e=>{
      const files=[...e.target.files];e.target.value="";if(!files.length)return;
      busy=true;f.querySelector("#s-busy").hidden=false;
      for(const file of files){try{pending.push(await compress(file))}catch(err){toast("有一張照片太大或無法讀取")}drawThumbs(f)}
      busy=false;f.querySelector("#s-busy").hidden=true;
    });
  }});
}
let busy=false;
/* full-screen ticket viewer */
let wake=null;
async function openViewer(stopId,idx){
  const st=S.stops[stopId];if(!st)return;const ids=(st.photos||[]).filter(pid=>S.photos[pid]);if(!ids.length){toast("照片還在下載，請稍候再試");return}
  let i=Math.min(idx,ids.length-1);
  const v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-modal","true");
  const draw=()=>{v.innerHTML=`<div class="vbar"><b>${esc(st.title)}</b><button class="vclose" type="button" data-vclose>關閉</button></div>
    <div class="vimg"><img src="${S.photos[ids[i]].data}" alt="票券 ${i+1}"></div>
    <div class="vnav">${ids.length>1?`<button type="button" data-vprev ${i===0?"disabled":""}>上一張</button><span>${i+1} / ${ids.length}</span><button type="button" data-vnext ${i===ids.length-1?"disabled":""}>下一張</button>`:`<span style="margin:auto">把螢幕亮度調高，刷碼更順</span>`}</div>`};
  const close=()=>{v.remove();try{wake&&wake.release()}catch(e){}wake=null};
  v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();
    if(b.dataset.vclose!=null)close();else if(b.dataset.vprev!=null&&i>0){i--;draw()}else if(b.dataset.vnext!=null&&i<ids.length-1){i++;draw()}});
  let x0=null;v.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  v.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){if(dx<0&&i<ids.length-1)i++;else if(dx>0&&i>0)i--;draw()}});
  draw();document.body.appendChild(v);
  try{wake=await navigator.wakeLock.request("screen")}catch(e){}
}
function editExp(id){
  const e=id?S.expenses[id]:{};
  sheet(id?"編輯花費":"記一筆",`
    <div class="field"><label for="e-title">項目</label><input id="e-title" name="title" required maxlength="100" value="${esc(e.title)}" placeholder="例如：機場快線"></div>
    <div class="two field"><div><label for="e-amt">金額（${esc(S.trip.currency||"TWD")}）</label><input id="e-amt" type="number" inputmode="decimal" min="0" step="any" name="amount" required value="${esc(e.amount)}"></div>
    <div><label for="e-cat">分類</label><select id="e-cat" name="cat">${CATS.map(c=>`<option ${c===(e.cat||"餐飲")?"selected":""}>${c}</option>`).join("")}</select></div></div>
    <div class="two field"><div><label for="e-day">哪一天</label><select id="e-day" name="day"><option value="">不指定</option>${dayOptions(e.day)}</select></div><div><label for="e-payer">誰付的</label><input id="e-payer" name="payer" maxlength="30" value="${esc(e.payer)}" placeholder="選填"></div></div>`,
  v=>put("expenses",id||uid(),{...v,amount:+v.amount||0,day:v.day?+v.day:null,ts:e.ts||Date.now()}),id?()=>del("expenses",id):null);
}

/* ---------- events ---------- */
document.addEventListener("click",e=>{
  const b=e.target.closest("button");if(!b)return;
  if(b.dataset.tab){tab=b.dataset.tab;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));
    ["plan","budget","pack"].forEach(k=>$("#p-"+k).hidden=k!==tab);window.scrollTo(0,0);}
  else if(b.dataset.day){day=+b.dataset.day;renderPlan()}
  else if(b.dataset.editStop)editStop(b.dataset.editStop);
  else if(b.dataset.view)openViewer(b.dataset.view,+b.dataset.idx);
  else if(b.dataset.editExp)editExp(b.dataset.editExp);
  else if(b.dataset.toggle){const id=b.dataset.toggle;put("packing",id,{...S.packing[id],done:!S.packing[id].done})}
  else if(b.dataset.delPack)del("packing",b.dataset.delPack);
});
$("#editTrip").onclick=editTrip;$("#invite").onclick=inviteSheet;$("#addStop").onclick=()=>editStop(null);$("#addExp").onclick=()=>editExp(null);
$("#packForm").onsubmit=e=>{e.preventDefault();const v=$("#packInput").value.trim();if(!v)return;put("packing",uid(),{text:v.slice(0,100),done:false,ts:Date.now()});$("#packInput").value=""};
$("#createTrip").onclick=createTrip;
$("#joinForm").onsubmit=e=>{e.preventDefault();const c=parseCode($("#joinInput").value);if(!c){toast("邀請碼格式不對，請貼上完整的連結或邀請碼");return}openTrip(c)};
addEventListener("online",()=>{online=true;render()});addEventListener("offline",()=>{online=false;render()});

let tt;function toast(m){clearTimeout(tt);let el=$(".toast");if(!el){el=document.createElement("div");el.className="toast";el.setAttribute("role","status");document.body.appendChild(el)}el.textContent=m;tt=setTimeout(()=>el.remove(),2600)}

/* ---------- boot ---------- */
(async()=>{
  if(!firebaseConfig||!firebaseConfig.apiKey||/YOUR_|貼上/.test(firebaseConfig.apiKey)){show("setup");return}
  try{
    const [app,fsm,auth]=await Promise.all([
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-app.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-firestore.js`),
      import(`https://www.gstatic.com/firebasejs/${V}/firebase-auth.js`)]);
    const fa=app.initializeApp(firebaseConfig);
    let db;try{db=fsm.initializeFirestore(fa,{localCache:fsm.persistentLocalCache({tabManager:fsm.persistentMultipleTabManager()})})}catch(e){db=fsm.getFirestore(fa)}
    fs=db;F=fsm;
    const au=auth.getAuth(fa);
    await new Promise((res,rej)=>{const u=auth.onAuthStateChanged(au,user=>{if(user){u();res()}else auth.signInAnonymously(au).catch(rej)})});
  }catch(e){console.error(e);show("setup");$("#g-setup p").textContent="連不上 Firebase："+(e.code||e.message)+"。請確認 firebase-config.js 內容正確，並已在 Firebase 開啟「匿名」登入。";return}
  const fromUrl=parseCode(new URLSearchParams(location.search).get("trip"));
  const code=fromUrl||parseCode(lsGet(KEY));
  code?openTrip(code):show("join");
})();
</script>
