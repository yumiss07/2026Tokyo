<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="旅程手帳">
<meta name="mobile-web-app-capable" content="yes">
<title>旅程手帳</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#FFFFFF">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&display=swap">
<style>
/* Layout: one-screen app — trip header card, scrolling panel, fixed bottom tab bar (boarding-pass motif: ink + stamp red) */
:root{
  /* 白底、奶咖卡片、咖啡色主色 */
  --bg:#FFFFFF; --surface:#F7F0E7; --ink:#3B2C22; --muted:#8C7767; --line:#E8DCCD;
  --accent:#8B5E3C; --accent-ink:#6E4527; --accent-soft:#EFE2D2; --stamp:#8B5E3C; --ok:#5E9A62; --warn:#D49A2A;
  --head-bg:#E07A3F; --head-ink:#FFFFFF; --head-sub:#FCE3D2;
  --i-plan:#F08A3C; --i-wallet:#E3B23C; --i-pack:#4FA9A0; --i-plan-soft:#FDE6D3; --i-wallet-soft:#FBF0D2; --i-pack-soft:#DDF1EE;
  --shadow:0 1px 2px rgba(91,62,38,.06),0 6px 18px rgba(91,62,38,.07);
  --f-display:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --f-mono:"Noto Serif TC","Songti TC","PMingLiU",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#2B221C; --surface:#382D25; --ink:#F4EADF; --muted:#BCA898; --line:#4A3D33;
  --accent:#C8976B; --accent-ink:#E0B993; --accent-soft:#4A3A2E; --stamp:#D9AE85; --ok:#8CC48F; --warn:#E8BC5A;
  --head-bg:#C9682F; --head-ink:#FFF8F2; --head-sub:#F6D6C0;
  --i-plan:#F7A25F; --i-wallet:#EFC660; --i-pack:#6FC6BC; --i-plan-soft:#4E3727; --i-wallet-soft:#4A4027; --i-pack-soft:#2B4441;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#2B221C; --surface:#382D25; --ink:#F4EADF; --muted:#BCA898; --line:#4A3D33;
  --accent:#C8976B; --accent-ink:#E0B993; --accent-soft:#4A3A2E; --stamp:#D9AE85; --ok:#8CC48F; --warn:#E8BC5A;
  --head-bg:#C9682F; --head-ink:#FFF8F2; --head-sub:#F6D6C0;
  --i-plan:#F7A25F; --i-wallet:#EFC660; --i-pack:#6FC6BC; --i-plan-soft:#4E3727; --i-wallet-soft:#4A4027; --i-pack-soft:#2B4441;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-variant-numeric:tabular-nums;font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}

/* trip header as a boarding pass */
.pass{cursor:pointer;background:var(--head-bg);color:var(--head-ink);border-radius:18px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.pass-top{padding:18px 18px 14px;display:flex;gap:12px;align-items:flex-start}
.pass-top .t{flex:1;min-width:0}
.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}
.pass .eyebrow{color:var(--head-sub)}
.pass .trip-name{letter-spacing:.12em}
.pass .plane{width:.95em;height:.95em;margin-left:.15em;vertical-align:-.08em;transform:rotate(90deg);display:inline-block}
.pass .dest{color:var(--head-sub)}
.pass .dates{color:var(--head-ink)}
.pass .link-btn{color:var(--head-ink);font-weight:600}
.pass .perf{border-top-color:rgba(255,255,255,.55)}
.pass :focus-visible{outline-color:var(--head-ink)}
.trip-name{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.25;margin:2px 0 0;text-wrap:balance;word-break:break-word}
.dest{color:var(--muted);margin-top:2px}
.stamp{flex:none;border:2px solid var(--stamp);color:var(--stamp);border-radius:10px;padding:4px 10px;font-family:var(--f-mono);font-size:13px;transform:rotate(-4deg);text-align:center;line-height:1.2}
.stamp b{display:block;font-size:20px}
.perf{height:0;border-top:2px dashed var(--line);margin:0 14px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg)}
.perf::before{left:-24px}.perf::after{right:-24px}
.pass-bot{padding:12px 18px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.dates{font-family:var(--f-mono);font-size:13px;color:var(--ink)}
.link-btn{background:none;border:0;color:var(--accent);padding:6px 0;font-weight:500}
.mode-note{font-size:12px;color:var(--muted);margin-top:8px;text-align:center}

/* panels */
.panel{margin-top:18px}
/* 標題卡片：往下滑時固定在上方並縮小 */
.passwrap{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);
  margin-left:calc(-1 * max(16px, env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px, env(safe-area-inset-right,0px)));
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:0 4px;margin-top:-16px;padding-top:16px;transition:padding .25s ease}
.pass-top,.pass .trip-name,.pass .dest,.pass .dates{transition:padding .25s ease,font-size .25s ease,margin .25s ease}
.pass .perf,.pass .pass-bot{transition:max-height .25s ease,padding .25s ease,opacity .2s ease,margin .25s ease;max-height:90px;overflow:visible}
.passwrap.shrunk{padding-top:8px}
.passwrap.shrunk .trip-name{font-size:18px;margin:0}
.passwrap.shrunk .dest{font-size:12px;margin-top:0}
.passwrap.shrunk .pass-top{padding:10px 16px 8px}
.passwrap.shrunk .pass-bot{padding:7px 16px 9px}
.passwrap.shrunk .dates{font-size:12px}
@media (prefers-reduced-motion:reduce){.passwrap,.pass-top,.pass .trip-name,.pass .dest,.pass .perf,.pass .pass-bot{transition:none}}
.panel-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:10px}
.panel-head h2{font-family:var(--f-display);font-size:19px;margin:0}
.days{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 8px;margin:0 -2px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:6px 12px;text-align:center;min-width:64px}
.day small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--muted)}
.day[aria-pressed="true"]{background:var(--accent);color:#fff;border-color:var(--accent)}
.day[aria-pressed="true"] small{color:inherit;opacity:.75}

.timeline{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{display:grid;grid-template-columns:56px 1fr;gap:10px}
.stop .time{font-family:var(--f-mono);font-size:13px;color:var(--accent);padding-top:14px;text-align:center;line-height:1.3}
.stop .time .end{display:block;color:var(--muted)}
.stop .time .end::before{content:"";display:block;width:1.5px;height:14px;margin:4px auto;background:var(--accent);opacity:.5;border-radius:1px}
.stop .time .len{display:block;font-size:10px;color:var(--muted);margin-top:2px;font-family:var(--f-body)}
.stop .dur{font-size:12px;color:var(--muted);margin-top:2px}
/* Plan B */
.planb{margin-top:10px;border:1.5px dashed var(--line);border-radius:12px;padding:0 12px}
.planb summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:8px;padding:9px 0;font-size:14px;min-width:0}
.planb summary::-webkit-details-marker{display:none}
.planb summary b{font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.planb summary::after{content:"展開";font-size:12px;color:var(--muted);flex:none}
.planb[open] summary::after{content:"收合"}
.pb-tag{flex:none;font-family:var(--f-mono);font-size:11px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:0 6px;line-height:18px}
.planb .pb-body{padding:0 0 10px;border-top:1px dashed var(--line);padding-top:8px}
.planb .place,.planb .note{margin-top:2px}
.pbbox{border:1.5px dashed var(--line);border-radius:12px;padding:12px 12px 2px;margin-bottom:12px}
.pbbox .pb-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.pbbox .pb-h b{font-size:14px}
.pbadd{background:none;border:1.5px dashed var(--line);border-radius:12px;width:100%;padding:10px;color:var(--accent);font-weight:500;margin-bottom:12px}
.stop .card{background:var(--surface);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);min-width:0;border-left:3px solid var(--accent)}
.stop h3{margin:0;font-family:var(--f-display);font-size:17px;font-weight:700;word-break:break-word}
.stop .place{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.stop .navto,.planb .navto{font-size:12px;color:var(--muted);margin-top:6px;word-break:break-all}
.tpick{display:flex;align-items:center;gap:4px;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:0 6px 0 4px;position:relative}
.tpick:focus-within{border-color:var(--accent)}
.tpick input.th,.tpick input.tm{width:2.6em;border:0;background:none;text-align:center;padding:10px 2px;font-family:var(--f-mono);font-size:17px;font-variant-numeric:tabular-nums}
.tpick input:focus{outline:none;background:var(--accent-soft);border-radius:6px}
.tpick .colon{font-size:17px;color:var(--muted)}
.tpick .tclear{margin-left:auto;border:0;background:none;color:var(--muted);font-size:18px;padding:4px 6px;line-height:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px;line-height:1.45}
.stop .note{font-size:13px;margin-top:6px;white-space:pre-wrap;word-break:break-word}
.row-actions{display:flex;gap:14px;margin-top:8px;flex-wrap:wrap}
.chip-link{font-size:13px;color:var(--accent);text-decoration:none;font-weight:500;background:none;border:0;padding:0}
.chip-link.muted{color:var(--muted)}

.empty{border:1.5px dashed var(--line);border-radius:14px;padding:22px 16px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);margin-bottom:4px}

/* budget */
.meter{background:var(--surface);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.meter .nums{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.big{font-family:var(--f-mono);font-size:26px;font-variant-numeric:tabular-nums}
.sub{font-size:12px;color:var(--muted)}
.bar{height:10px;border-radius:6px;background:var(--accent-soft);margin:12px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.bar.over i{background:var(--stamp)}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.cat{background:var(--accent-soft);border-radius:10px;padding:8px 10px;min-width:0}
.cat .n{font-size:12px;color:var(--muted)}
.cat .v{font-family:var(--f-mono);font-size:14px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.list{list-style:none;margin:12px 0 0;padding:0;background:var(--surface);border-radius:16px;box-shadow:var(--shadow)}
.list li{display:flex;gap:12px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.list li:first-child{border-top:0}
.list .main{flex:1;min-width:0}
.list .main div{word-break:break-word}
.list .meta{font-size:12px;color:var(--muted)}
.stage{margin-top:12px}
.wsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.wsum button{border:1.5px solid transparent;background:var(--surface);border-radius:14px;padding:12px 8px;box-shadow:var(--shadow);text-align:center;min-width:0;display:flex;flex-direction:column;align-items:center;gap:4px}
.wsum .n{font-size:13px;color:var(--muted);text-align:center;width:100%}
.wsum .v{font-family:var(--f-mono);font-size:16px;line-height:1.35;font-variant-numeric:tabular-nums;color:var(--ink);max-width:100%;overflow:hidden;text-overflow:ellipsis}
.wsum .v.zero{color:var(--muted)}
.wsum button[aria-selected="true"]{border-color:var(--c);background:var(--accent-soft)}
.wsum .paid{--c:var(--ok)}.wsum .hold{--c:var(--warn)}.wsum .budget{--c:var(--accent)}
.wlist-head{display:flex;justify-content:flex-end;margin:14px 0 8px}
.meter .label{font-size:12px;color:var(--muted)}
.meter .legend2{display:flex;flex-wrap:wrap;gap:2px 12px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.meter .legend2 b{font-weight:500;color:var(--ink);font-family:var(--f-mono)}
.meter .legend2 .over{color:var(--stamp)}
.meter details{margin-top:10px;border-top:1px solid var(--line);padding-top:8px}
.meter summary{font-size:13px;color:var(--accent);cursor:pointer;list-style:none}
.meter summary::-webkit-details-marker{display:none}
.meter summary::after{content:" ▾"}
.meter details[open] summary::after{content:" ▴"}
.stage-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px;font-size:13px;color:var(--muted)}
.stage-bar b{font-family:var(--f-mono);font-weight:500;color:var(--ink)}
.stage-bar .btn{padding:7px 14px;font-size:14px}
.list .row{display:flex;gap:12px;align-items:center;width:100%;background:none;border:0;padding:12px 14px;text-align:left}
.list li.r{padding:0}
.money .sub2{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap;margin-top:1px}
.money .sub2 .up{color:var(--stamp)}.money .sub2 .down{color:var(--ok)}
.money .act.est{color:var(--muted)}
.stage-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px}
.stage-head h3{margin:0;font-size:16px;display:flex;align-items:center;gap:8px}
.stage-head h3 i{width:10px;height:10px;border-radius:3px;display:inline-block;background:var(--accent)}
.stage.trip .stage-head h3 i{background:var(--warn)}
.stage-head .sub{margin-top:2px}
.stage-sum{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:2px}
.stage-sum b{font-family:var(--f-mono);font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums}
.money{text-align:right;flex:none}
.money .act{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.money .pl{font-size:12px;color:var(--muted);font-family:var(--f-mono);white-space:nowrap}
.money .diff{font-size:11px;font-family:var(--f-mono)}
.money .diff.up{color:var(--stamp)}.money .diff.down{color:var(--ok)}
.unpaid{font-size:11px;border:1px solid var(--warn);color:var(--warn);border-radius:999px;padding:1px 8px;white-space:nowrap}
.bar2{height:10px;border-radius:6px;background:var(--accent-soft);margin:12px 0 6px;overflow:hidden;display:flex}
.bar2 i{display:block;height:100%}
.bar2 .a{background:var(--accent)}.bar2 .p{background:var(--warn);opacity:.55}
.bar2.over .a{background:var(--stamp)}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:0;background:var(--accent)}
.legend span.p::before{background:var(--warn);opacity:.55}
.legend span.r::before{background:var(--accent-soft)}
.stage-tabs{margin-top:16px}
.stage-tabs button{border:0;background:none;padding:9px 4px;border-radius:9px;color:var(--muted);font-size:15px;display:flex;flex-direction:column;align-items:center;gap:1px}
.stage-tabs button small{font-size:11px;font-family:var(--f-mono)}
.stage-tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)}
.stage-tabs+.stage{margin-top:14px}
.seg.seg3{grid-template-columns:1fr 1fr 1fr}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg label{margin:0;text-align:center;padding:8px 4px;border-radius:9px;cursor:pointer;color:var(--muted);font-size:14px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg input:checked+span{color:var(--ink);font-weight:700}
.seg label:has(input:checked){background:var(--surface);box-shadow:var(--shadow)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.amt{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tag{font-size:11px;border-radius:999px;padding:2px 8px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}

/* packing */
.quick{display:flex;gap:8px;margin-bottom:4px}
.quick input{flex:1;min-width:0}
.check{width:24px;height:24px;border-radius:7px;border:2px solid var(--line);background:none;flex:none;display:grid;place-items:center;padding:0}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.done .main div:first-child{text-decoration:line-through;color:var(--muted)}
.x{background:none;border:0;color:var(--muted);font-size:18px;padding:4px 6px;line-height:1}

/* controls */
.btn{border:0;border-radius:12px;padding:10px 16px;font-weight:700;background:var(--accent);color:#fff}
.btn.ghost{background:var(--accent-soft);color:var(--accent-ink)}
.btn.danger{background:none;color:var(--stamp);padding-inline:4px}
input,select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
textarea{resize:vertical;min-height:70px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:4px}
.field{margin-bottom:12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:5}
.tabs-inner{display:flex;width:100%;max-width:560px}
.tab{flex:1;background:none;border:0;padding:8px 0 10px;color:var(--muted);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tab svg{width:24px;height:24px}
.tab{--c:var(--muted);--cs:transparent}
.tab[data-tab="plan"]{--c:var(--i-plan);--cs:var(--i-plan-soft)}
.tab[data-tab="budget"]{--c:var(--i-wallet);--cs:var(--i-wallet-soft)}
.tab[data-tab="pack"]{--c:var(--i-pack);--cs:var(--i-pack-soft)}
.tab svg{color:var(--c);opacity:.9;padding:3px 14px;box-sizing:content-box;border-radius:999px;transition:background .15s}
.tab[aria-selected="true"]{color:var(--ink);font-weight:700}
.tab[aria-selected="true"] svg{opacity:1;background:var(--cs)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,18,22,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px max(18px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-right,0px));max-height:88%;overflow-y:auto;animation:up .2s ease-out}
.sheet h3{font-family:var(--f-display);margin:0 0 14px;font-size:19px}
.sheet .foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:6px}
.sheet .foot .r{display:flex;gap:8px;margin-left:auto}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}.bar i{transition:none}}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:13px;z-index:30}
@media (max-width:380px){.cats{grid-template-columns:repeat(2,1fr)}}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
</style><style>
/* gate screens (setup / join) */
.gate{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);padding:20px 18px;margin-top:16px}
.gate h2{font-family:var(--f-display);font-size:20px;margin:0 0 6px}
.gate p{color:var(--muted);margin:0 0 14px}
.gate .stack{display:flex;flex-direction:column;gap:10px}
.or{text-align:center;color:var(--muted);font-size:12px;margin:6px 0}
.codebox{font-family:var(--f-mono);font-size:13px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;word-break:break-all;user-select:all}
.sync{display:inline-flex;align-items:center;gap:6px}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}

.pass-bot .acts{display:flex;gap:16px}
/* ticket photos */
.tickets{display:flex;gap:8px;margin-top:10px;overflow-x:auto;padding-bottom:2px}
.ticket{flex:none;width:64px;height:64px;border-radius:10px;border:1px solid var(--line);background:#fff;padding:0;overflow:hidden;position:relative}
.ticket img{width:100%;height:100%;object-fit:cover;display:block}
.ticket span{position:absolute;inset:auto 0 0;background:rgba(59,44,34,.7);color:#fff;font-size:10px;text-align:center;line-height:16px}
.thumbs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.thumbs:empty{display:none}
.thumb{position:relative;width:72px;height:72px;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:#fff}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb button{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(59,44,34,.75);color:#fff;font-size:14px;line-height:24px;padding:0}
label.addphoto{display:inline-block;margin:0;color:var(--accent);font-size:15px;cursor:pointer}
.viewer{position:fixed;inset:0;z-index:40;background:#fff;display:flex;flex-direction:column;color:#3B2C22}
.viewer .vbar{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));gap:10px}
.viewer .vbar b{font-size:15px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.viewer .vclose{border:0;background:#8B5E3C;color:#fff;border-radius:10px;padding:8px 14px;font-weight:700;flex:none}
.viewer .vimg{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:8px}
.viewer .vimg img{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vnav{display:flex;justify-content:space-between;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));color:#8C7767}
.viewer .vnav button{border:1px solid #E6D8C6;background:#fff;border-radius:10px;padding:8px 16px;color:#3B2C22}
.viewer .vnav button:disabled{opacity:.3}
</style>
</head>
<body>
<div class="app">
  <!-- setup needed -->
  <section class="gate" id="g-setup" hidden>
    <div class="eyebrow">尚未完成設定</div>
    <h2>還沒接上 Firebase</h2>
    <p>請把 Firebase 專案的設定貼進 <b>firebase-config.js</b>，重新上傳到 GitHub 後再打開。</p>
  </section>

  <!-- join / create -->
  <section class="gate" id="g-join" hidden>
    <div class="eyebrow">Boarding · 旅程手帳</div>
    <h2>開始一趟旅程</h2>
    <p>建立新的行程，或用旅伴傳給你的邀請連結／邀請碼加入。</p>
    <div class="stack">
      <button class="btn" id="createTrip" type="button">建立新旅程</button>
      <div class="or">或</div>
      <form id="joinForm" class="stack">
        <label for="joinInput" style="margin:0">邀請碼或邀請連結</label>
        <input id="joinInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="貼上旅伴給你的邀請碼">
        <button class="btn ghost" type="submit">加入旅程</button>
      </form>
    </div>
  </section>

  <div id="main" hidden>
  <div class="passwrap" id="passWrap">
  <section class="pass" id="passCard" role="button" tabindex="0" aria-label="旅程資訊，點一下可編輯">
    <div class="pass-top">
      <div class="t">
        <h1 class="trip-name"><span id="tripName">我的旅程</span><svg class="plane" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"/></svg></h1>
        <div class="dest" id="tripDest">尚未設定目的地</div>
      </div>
    </div>
    <div class="perf"></div>
    <div class="pass-bot">
      <span class="dates" id="tripDates">日期未設定</span>
    </div>
  </section>
  </div>
  <p class="mode-note" id="offlineNote" hidden><span class="sync off"><i></i>離線中 · 恢復連線後會自動同步</span></p>

  <section class="panel" id="p-plan">
    <div class="panel-head"><h2>每日行程</h2><button class="btn ghost" id="addStop" type="button">＋ 新增</button></div>
    <div class="days" id="days" role="group" aria-label="選擇天數"></div>
    <ol class="timeline" id="stops"></ol>
  </section>

  <section class="panel" id="p-budget" hidden>
    <div class="panel-head"><h2>錢包</h2></div>
    <div id="meter"></div>
    <div id="stages"></div>
  </section>

  <section class="panel" id="p-pack" hidden>
    <div class="panel-head"><h2>行李清單</h2><span class="sub" id="packCount"></span></div>
    <form class="quick" id="packForm"><input id="packInput" placeholder="新增物品，例如：護照、轉接頭" autocomplete="off" aria-label="新增物品"><button class="btn" type="submit">加入</button></form>
    <ul class="list" id="packs"></ul>
  </section>
  </div>
</div>

<nav class="tabs" role="tablist" id="tabs" hidden><div class="tabs-inner">
  <button class="tab" role="tab" data-tab="plan" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>行程</button>
  <button class="tab" role="tab" data-tab="budget" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/></svg>錢包</button>
  <button class="tab" role="tab" data-tab="pack" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="7" width="14" height="13" rx="2.5"/><path d="M9 7V4.5h6V7M9 11v5M15 11v5"/></svg>行李</button>
</div></nav>

<div id="sheetRoot"></div>

<script type="module">
import { firebaseConfig } from "./firebase-config.js";
const V="10.14.1";
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const CATS=["機票","交通","住宿","網路","租車","餐飲","門票","購物","其他"];
const WD="日一二三四五六";
const KEY="trip-code";
const S={trip:{},stops:{},expenses:{},packing:{},photos:{}};
let budgetStage="paid";
let fs=null, F=null, tripCode=null, tab="plan", day=1, unsubs=[], online=navigator.onLine;

const lsGet=k=>{try{return localStorage.getItem(k)}catch(e){return null}};
const lsSet=(k,v)=>{try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}};
function show(view){$("#g-setup").hidden=view!=="setup";$("#g-join").hidden=view!=="join";$("#main").hidden=view!=="main";$("#tabs").hidden=view!=="main"}

/* ---------- invite codes ---------- */
function newCode(){const a="abcdefghjkmnpqrstuvwxyz23456789";const r=crypto.getRandomValues(new Uint8Array(24));return Array.from(r,x=>a[x%a.length]).join("")}
function parseCode(v){v=(v||"").trim();try{const u=new URL(v);v=u.searchParams.get("trip")||v}catch(e){}v=v.replace(/[^a-z0-9]/gi,"").toLowerCase();return v.length>=20&&v.length<=40?v:null}
const inviteLink=()=>location.origin+location.pathname+"?trip="+tripCode;

/* ---------- firestore writes ---------- */
const tripRef=()=>F.doc(fs,"trips",tripCode);
const itemRef=(col,id)=>F.doc(fs,"trips",tripCode,col,id);
function put(col,id,data){
  if(col==="trip"){S.trip={...S.trip,...data}}else{S[col][id]=data}
  render();
  const p=col==="trip"?F.setDoc(tripRef(),data,{merge:true}):F.setDoc(itemRef(col,id),data);
  p.catch(fail);
}
function del(col,id){delete S[col][id];render();F.deleteDoc(itemRef(col,id)).catch(fail)}
function fail(e){console.error(e);toast(e&&e.code==="permission-denied"?"沒有權限，請確認邀請碼是否正確":"儲存失敗："+(e&&e.code||"請稍後再試"))}

/* ---------- open a trip ---------- */
function stopListening(){unsubs.forEach(u=>u());unsubs=[];S.trip={};S.stops={};S.expenses={};S.packing={};S.photos={}}
function openTrip(code){
  stopListening();tripCode=code;lsSet(KEY,code);day=1;history.replaceState(null,"",location.pathname+"?trip="+code);show("main");render();
  let seen=false;
  unsubs.push(F.onSnapshot(tripRef(),{includeMetadataChanges:true},s=>{
    if(!s.exists()){ if(!s.metadata.fromCache){toast("找不到這個旅程，請確認邀請碼");leaveTrip()} return }
    seen=true;S.trip={...s.data()};render();
  },e=>{fail(e)}));
  ["stops","expenses","packing","photos"].forEach(col=>unsubs.push(F.onSnapshot(F.collection(fs,"trips",code,col),q=>{
    const m={};q.forEach(d=>m[d.id]={...d.data()});S[col]=m;render();
  },e=>console.warn(col,e.code))));
}
async function createTrip(){
  const code=newCode();
  try{await Promise.race([F.setDoc(F.doc(fs,"trips",code),{name:"",createdAt:Date.now()}),new Promise(r=>setTimeout(r,4000))]);}catch(e){fail(e);return}
  openTrip(code);setTimeout(editTrip,200);
}
function leaveTrip(){stopListening();tripCode=null;lsSet(KEY,null);history.replaceState(null,"",location.pathname);show("join")}

/* ---------- dates ---------- */
function parseD(s){if(!s)return null;const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}
function md(d){return (d.getMonth()+1)+"/"+d.getDate()+" ("+WD[d.getDay()]+")"}
function dayCount(){const a=parseD(S.trip.start),b=parseD(S.trip.end);if(a&&b&&b>=a)return Math.min(30,Math.round((b-a)/864e5)+1);return Math.max(3,...Object.values(S.stops).map(s=>s.day||1))}
const HOME=()=>S.trip.currency||"TWD";
const FX=()=>S.trip.fx||"JPY";
const RATE=()=>+S.trip.rate||0.21;
const fmt=n=>Math.round(n).toLocaleString("zh-TW");
const money=n=>HOME()+" "+fmt(n);
const toHome=(n,c)=>c&&c!==HOME()?n*RATE():n;
const SYM={TWD:"$",JPY:"¥",USD:"US$",KRW:"₩",EUR:"€",HKD:"HK$",CNY:"CN¥"};
const CURNAME={TWD:"台幣",JPY:"日幣",USD:"美金",KRW:"韓元",EUR:"歐元",HKD:"港幣",CNY:"人民幣"};
const curName=c=>CURNAME[c]||c;
const cash=(n,c)=>(SYM[c]||c+" ")+fmt(n);
const numOrNull=v=>v===""||v==null||isNaN(+v)?null:+v;
function expNorm(e){
  // 舊資料轉換：出發前已付／有實際金額 → 已付；沒有實際金額 → 預算
  if(["paid","hold","budget"].includes(e.stage)) return {stage:e.stage,cur:e.cur||HOME(),amount:+e.amount||0};
  const legacy=e.planned===undefined&&e.actual===undefined;
  const act=legacy?numOrNull(e.amount):numOrNull(e.actual), pl=numOrNull(e.planned);
  return {stage:act!=null?"paid":"budget",cur:e.cur||HOME(),amount:act!=null?act:(pl||0)};
}
const STAGES=[{k:"paid",name:"已付",hint:"已經付掉的錢，例如機票、eSIM"},{k:"hold",name:"暫付",hint:"已經訂好、還沒付款的，例如到現場才付的飯店"},{k:"budget",name:"預算",hint:"預計會花的錢，例如購物、租車、餐費"}];

/* ---------- render ---------- */
function render(){
  if(!tripCode)return;
  const t=S.trip;
  $("#tripName").textContent=t.name||"我的旅程";
  $("#tripDest").textContent=t.dest||"點這張卡片可以編輯旅程";
  const a=parseD(t.start),b=parseD(t.end);
  $("#tripDates").textContent=a&&b?`${a.getFullYear()}/${md(a)} → ${md(b)} · ${dayCount()} 天`:"日期未設定";
  $("#offlineNote").hidden=online;
  renderPlan();renderBudget();renderPack();
}
function renderPlan(){
  const n=dayCount();if(day>n)day=1;const a=parseD(S.trip.start);
  $("#days").innerHTML=Array.from({length:n},(_,i)=>{const d=i+1;const cnt=Object.values(S.stops).filter(s=>(s.day||1)===d).length;
    return `<button class="day" type="button" data-day="${d}" aria-pressed="${d===day}">Day ${d}<small>${a?md(addDays(a,i)):cnt+" 個行程"}</small></button>`}).join("");
  const list=Object.entries(S.stops).filter(([,s])=>(s.day||1)===day).sort((x,y)=>(x[1].time||"99").localeCompare(y[1].time||"99"));
  $("#stops").innerHTML=list.length?list.map(([id,s])=>{
    const m=mapLinks(s.place,s.title,s.nav);
    return `<li class="stop"><div class="time">${esc(s.time||"—")}${s.endTime?`<span class="end">${esc(s.endTime)}</span><span class="len">${dur(s.time,s.endTime)}</span>`:""}</div><div class="card">
      <h3>${esc(s.title)}</h3>${s.place?`<div class="place">📍 ${esc(s.place)}</div>`:""}${s.note?`<div class="note">${esc(s.note)}</div>`:""}
      ${(s.photos||[]).length?`<div class="tickets">${s.photos.map((pid,i)=>`<button class="ticket" type="button" data-view="${id}" data-idx="${i}" aria-label="打開票券 ${i+1}">${S.photos[pid]?`<img src="${S.photos[pid].data}" alt="">`:""}<span>票券 ${i+1}</span></button>`).join("")}</div>`:""}
      ${mapButtons(m)}
      <button class="chip-link muted" type="button" data-edit-stop="${id}">編輯</button></div>${planBHtml(id,s)}</div></li>`}).join("")
    :`<li class="empty"><strong>Day ${day} 還沒有安排</strong>按右上角「＋ 新增」加入景點、餐廳或交通</li>`;
}
function renderBudget(){
  const items=Object.entries(S.expenses).map(([id,e])=>[id,e,expNorm(e)]);
  // 各類別、各幣別分開加總
  const tot={paid:{},hold:{},budget:{}};
  items.forEach(([,,n])=>{tot[n.stage][n.cur]=(tot[n.stage][n.cur]||0)+n.amount});
  const order=c=>c===HOME()?0:c===FX()?1:2;
  const lines=k=>{const cs=Object.keys(tot[k]).sort((a,b)=>order(a)-order(b));return cs.length?cs.map(c=>`<span class="v">${cash(tot[k][c],c)}</span>`).join(""):`<span class="v zero">${cash(0,HOME())}</span>`};
  $("#meter").innerHTML=`<div class="wsum" role="tablist" aria-label="錢包分類">${STAGES.map(x=>`<button type="button" role="tab" class="${x.k}" data-stage-tab="${x.k}" aria-selected="${budgetStage===x.k}"><span class="n">${x.name}</span>${lines(x.k)}</button>`).join("")}</div>`;
  const st=STAGES.find(x=>x.k===budgetStage);
  const rows=items.filter(([,,n])=>n.stage===st.k).sort((x,y)=>(y[1].ts||0)-(x[1].ts||0));
  $("#stages").innerHTML=`<div class="wlist-head"><button class="btn ghost" type="button" data-add-exp="${st.k}">＋ 新增</button></div>
    <ul class="list">${rows.length?rows.map(([id,e,n])=>{
      return `<li class="r"><button class="row" type="button" data-edit-exp="${id}"><div class="main"><div>${esc(e.title)}</div><div class="meta">${[esc(e.cat||"其他"),e.day?"Day "+e.day:"",e.payer?esc(e.payer):""].filter(Boolean).join(" · ")}</div></div>
        <div class="money"><div class="act">${esc(cash(n.amount,n.cur))}</div><div class="sub2">${esc(curName(n.cur))}</div></div></button></li>`}).join("")
    :`<li class="empty" style="border:0"><strong>還沒有${st.name}的項目</strong>${st.hint}</li>`}</ul>`;
}
function renderPack(){
  const it=Object.entries(S.packing).sort((x,y)=>(x[1].done-y[1].done)||((x[1].ts||0)-(y[1].ts||0)));
  const done=it.filter(([,p])=>p.done).length;
  $("#packCount").textContent=it.length?`已打包 ${done} / ${it.length}`:"";
  $("#packs").innerHTML=it.length?it.map(([id,p])=>`<li class="${p.done?"done":""}"><button class="check" type="button" aria-pressed="${!!p.done}" aria-label="已打包" data-toggle="${id}">${p.done?"✓":""}</button><div class="main"><div>${esc(p.text)}</div></div><button class="x" type="button" aria-label="刪除" data-del-pack="${id}">×</button></li>`).join("")
    :`<li class="empty" style="border:0"><strong>清單是空的</strong>在上方輸入要帶的東西，打包好就打勾</li>`;
}

/* ---------- sheets ---------- */
function sheet(title,html,onSave,onDelete,opts={}){
  const root=$("#sheetRoot");
  root.innerHTML=`<div class="scrim"><form class="sheet" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h3>${esc(title)}</h3>${html}
    <div class="foot">${onDelete?`<button class="btn danger" type="button" data-del>${esc(opts.delLabel||"刪除")}</button>`:""}<div class="r"><button class="btn ghost" type="button" data-close>${onSave?"取消":"關閉"}</button>${onSave?`<button class="btn" type="submit">儲存</button>`:""}</div></div></form></div>`;
  const f=root.querySelector("form");const close=()=>root.innerHTML="";
  root.querySelector(".scrim").addEventListener("click",e=>{if(e.target.classList.contains("scrim"))close()});
  f.querySelector("[data-close]").onclick=close;
  let armed=false;const d=f.querySelector("[data-del]");
  if(d)d.onclick=()=>{if(!armed){armed=true;d.textContent="再按一次確認";return}onDelete();close()};
  f.onsubmit=e=>{e.preventDefault();if(!onSave)return;const v=Object.fromEntries(new FormData(f));if(onSave(v)!==false)close()};
  if(opts.onOpen)opts.onOpen(f);
  else{const first=f.querySelector("input,select,textarea");if(first)setTimeout(()=>first.focus(),50)}
}
const dayOptions=sel=>Array.from({length:dayCount()},(_,i)=>`<option value="${i+1}" ${i+1==sel?"selected":""}>Day ${i+1}</option>`).join("");

function editTrip(){
  const t=S.trip;
  sheet("編輯旅程",`
    <div class="field"><label for="f-name">旅程名稱</label><input id="f-name" name="name" value="${esc(t.name)}" placeholder="例如：東京冬季五日遊"></div>
    <div class="field"><label for="f-dest">副標題</label><input id="f-dest" name="dest" value="${esc(t.dest)}" placeholder="例如：Linus&amp;Yumiss"></div>
    <div class="field"><label for="f-area">地圖搜尋地區（開地圖時自動加在地點後面）</label><input id="f-area" name="area" value="${esc(t.area??t.dest??"")}" placeholder="例如：日本東京"></div>
    <div class="two field"><div><label for="f-start">出發日</label><input id="f-start" type="date" name="start" value="${esc(t.start)}"></div><div><label for="f-end">回程日</label><input id="f-end" type="date" name="end" value="${esc(t.end)}"></div></div>
    <div class="two field"><div><label for="f-cur">本國幣別</label><input id="f-cur" name="currency" value="${esc(t.currency||"TWD")}" maxlength="5"></div><div><label for="f-fx">當地幣別</label><input id="f-fx" name="fx" value="${esc(t.fx||"JPY")}" maxlength="5"></div></div>
    <div class="field"><div><label for="f-rate">匯率（1 當地幣 = ? 本國幣）</label><input id="f-rate" type="number" inputmode="decimal" step="any" min="0" name="rate" value="${esc(t.rate||0.21)}"></div></div>
    <button class="btn ghost" type="button" id="toInvite" style="width:100%;margin-bottom:12px">邀請旅伴（複製連結）</button>`,
  v=>{if(v.start&&v.end&&v.end<v.start){toast("回程日不能早於出發日");return false}put("trip",null,{...v,currency:(v.currency||"TWD").toUpperCase(),fx:(v.fx||"JPY").toUpperCase(),rate:+v.rate||0.21})},null,

const mapArea=()=>S.trip.area!=null?S.trip.area:(S.trip.dest||"");
/* 地圖／導航連結：有自訂導航目標就用它，否則用「地點＋地圖搜尋地區」 */
function mapLinks(place,title,nav){
  const n=(nav||"").trim();
  const G="https://www.google.com/maps/";
  if(/^https?:\/\/\S+$/i.test(n))return {search:n,dir:n,label:"Google 地圖連結"};
  const ll=n.replace(/\s+/g,"");
  if(/^-?\d{1,2}(\.\d+)?,-?\d{1,3}(\.\d+)?$/.test(ll))return {search:G+"search/?api=1&query="+ll,dir:G+"dir/?api=1&destination="+ll,label:ll};
  const area=mapArea();const q=encodeURIComponent(n?(area&&!n.includes(area)?n+" "+area:n):[place||title,area].filter(Boolean).join(" "));
  return {search:G+"search/?api=1&query="+q,dir:G+"dir/?api=1&destination="+q,label:n||""};
}
function mapButtons(m){

function dur(a,b){const m=(t=>{const[h,mi]=t.split(":").map(Number);return h*60+mi});const d=m(b)-m(a);const h=Math.floor(d/60),mi=d%60;return (h?h+" 小時":"")+(mi?(h?" ":"")+mi+" 分":"")}
async function compress(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1600,q=0.88,out="";
    for(let k=0;k<7;k++){
      const sc=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*sc),h=Math.round(img.naturalHeight*sc);
      const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);
      out=c.toDataURL("image/jpeg",q);if(out.length<850000)break;max=Math.round(max*0.82);q=Math.max(0.72,q-0.04);
    }
    if(out.length>=950000)throw new Error("too big");
    return out;
  }finally{URL.revokeObjectURL(url)}
}
/* 自訂時間輸入：時、分可以直接打數字，分預設 00 */
function timeBox(id,name,val,label){
  const [h,m]=(val||"").split(":");
  return `<div class="tpick" data-tpick><input id="${id}" class="th" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="時" value="${esc(h||"")}" aria-label="${label}（時）" autocomplete="off"><span class="colon">:</span><input id="${id}-m" class="tm" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" placeholder="分" value="${esc(m||(h?"":"00"))}" aria-label="${label}（分）" autocomplete="off"><input type="hidden" name="${name}" value="${esc(val||"")}"><button type="button" class="tclear" aria-label="清除${label}" ${val?"":"hidden"}>×</button></div>`;
}
function initTimeBoxes(f){
  f.querySelectorAll("[data-tpick]").forEach(box=>{
    const h=box.querySelector(".th"),m=box.querySelector(".tm"),hid=box.querySelector("input[type=hidden]"),clr=box.querySelector(".tclear");
    const digits=el=>el.value.replace(/\D/g,"").slice(0,2);
    const sync=()=>{
      const hv=digits(h),mv=digits(m);
      if(hv===""){hid.value="";clr.hidden=true;return}
      const hh=Math.min(23,+hv),mm=Math.min(59,+(mv||0));
      hid.value=String(hh).padStart(2,"0")+":"+String(mm).padStart(2,"0");clr.hidden=false;
    };
    h.addEventListener("focus",()=>h.select());m.addEventListener("focus",()=>m.select());
    h.addEventListener("input",()=>{h.value=digits(h);if(!m.value)m.value="00";if(h.value.length===2||+h.value>2){m.focus()}sync()});
    m.addEventListener("input",()=>{m.value=digits(m);sync()});
    h.addEventListener("blur",()=>{if(h.value!==""){h.value=String(Math.min(23,+h.value)).padStart(2,"0")}sync()});
    m.addEventListener("blur",()=>{m.value=m.value===""?"00":String(Math.min(59,+m.value)).padStart(2,"0");sync()});
    m.addEventListener("keydown",e=>{if(e.key==="Backspace"&&m.value===""){e.preventDefault();h.focus()}});
    clr.addEventListener("click",()=>{h.value="";m.value="00";sync();h.focus()});
  });
}

  {onOpen:f=>{

    f.querySelector("#pb-add").onclick=()=>{f.querySelector("#pb-on").value="1";f.querySelector("#pb-box").hidden=false;f.querySelector("#pb-add").hidden=true;f.querySelector("#pb-title").focus()};

async function openViewer(stopId,idx){
  const st=S.stops[stopId];if(!st)return;const ids=(st.photos||[]).filter(pid=>S.photos[pid]);if(!ids.length){toast("照片還在下載，請稍候再試");return}
  let i=Math.min(idx,ids.length-1);
  const v=document.createElement("div");v.className="viewer";v.setAttribute("role","dialog");v.setAttribute("aria-modal","true");
  const draw=()=>{v.innerHTML=`<div class="vbar"><b>${esc(st.title)}</b><button class="vclose" type="button" data-vclose>關閉</button></div>
    <div class="vimg"><img src="${S.photos[ids[i]].data}" alt="票券 ${i+1}"></div>
    <div class="vnav">${ids.length>1?`<button type="button" data-vprev ${i===0?"disabled":""}>上一張</button><span>${i+1} / ${ids.length}</span><button type="button" data-vnext ${i===ids.length-1?"disabled":""}>下一張</button>`:`<span style="margin:auto">把螢幕亮度調高，刷碼更順</span>`}</div>`};
  const close=()=>{v.remove();try{wake&&wake.release()}catch(e){}wake=null};
  v.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;e.stopPropagation();
    if(b.dataset.vclose!=null)close();else if(b.dataset.vprev!=null&&i>0){i--;draw()}else if(b.dataset.vnext!=null&&i<ids.length-1){i++;draw()}});
  let x0=null;v.addEventListener("touchstart",e=>{x0=e.touches[0].clientX},{passive:true});
  v.addEventListener("touchend",e=>{if(x0==null)return;const dx=e.changedTouches[0].clientX-x0;x0=null;if(Math.abs(dx)>50){if(dx<0&&i<ids.length-1)i++;else if(dx>0&&i>0)i--;draw()}});
  draw();document.body.appendChild(v);
  try{wake=await navigator.wakeLock.request("screen")}catch(e){}
}
